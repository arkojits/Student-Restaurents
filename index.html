<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Restaurants Finland</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Student Restaurants Finland</h1>
    <p>Find student restaurants and check daily or weekly menus.</p>
  </header>

  <main>
    <section class="filters">
      <input
        type="text"
        id="search"
        placeholder="Search restaurant..."
      >

      <select id="city-filter">
        <option value="">All cities</option>
      </select>
    </section>

    <section>
      <h2>Restaurants</h2>
      <div id="restaurant-list"></div>
    </section>
  </main>
  <dialog id="menu-dialog">
  <button id="close-dialog">Close</button>

  <h2 id="restaurant-name"></h2>

  <div class="menu-buttons">
    <button id="daily-button">Daily Menu</button>
    <button id="weekly-button">Weekly Menu</button>
  </div>

  <div id="menu-content"></div>
</dialog>
  <script type="module" src="js/main.js"></script>
</body>
</html>
